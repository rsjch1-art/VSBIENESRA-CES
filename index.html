<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Miriam Vazquez | Propiedades Premium Guatemala</title>
	<meta name="description" content="Descubre casas, apartamentos y terrenos en Guatemala. Agencia inmobiliaria profesional con propiedades en zonas premium.">
	<meta name="keywords" content="propiedades Guatemala, compra venta inmuebles, apartamentos, casas, terrenos, zona 10, real estate">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="styles.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar navbar-dark sticky-top border-bottom">
		<div class="container-xxl">
			<span class="navbar-brand fw-bold fs-5 mb-0">Miriam Vazquez</span>
			<div class="d-flex gap-2 align-items-center flex-wrap">
				<input type="search" class="form-control form-control-sm" id="search" placeholder="Buscar propiedad...">
				<a href="admin.html" class="btn btn-sm btn-outline-light">Admin</a>
			</div>
		</div>
	</nav>

	<section class="py-5 text-center border-bottom" style="background:linear-gradient(135deg at 0 0, rgba(131,90,11,.1), transparent),linear-gradient(135deg at 100% 100%, rgba(201,162,39,.05), transparent)">
		<div class="container">
			<h1 class="display-5 fw-bold mb-2">Propiedades en Guatemala</h1>
			<p class="lead text-secondary mb-0">Agencia inmobiliaria profesional con propiedades premium</p>
		</div>
	</section>

	<div class="container-xxl py-5">
		<div class="row mb-4 g-2">
			<div class="col-sm-3">
				<select class="form-select form-select-sm" id="zone"><option value="">Todas las zonas</option></select>
			</div>
			<div class="col-sm-3">
				<input type="number" class="form-control form-control-sm" id="minPrice" placeholder="Precio mín">
			</div>
			<div class="col-sm-3">
				<input type="number" class="form-control form-control-sm" id="maxPrice" placeholder="Precio máx">
			</div>
			<div class="col-sm-3">
				<button class="btn btn-outline-secondary btn-sm w-100" onclick="resetFilters()">Limpiar</button>
			</div>
		</div>

		<div class="row g-4" id="grid"></div>
	</div>

	<div class="modal fade" id="modal" tabindex="-1">
		<div class="modal-dialog modal-lg">
			<div class="modal-content border-0">
				<div class="modal-header border-bottom ps-4 pe-4">
					<h5 class="modal-title" id="mTitle"></h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body p-4">
					<div style="height:300px;background-size:cover;background-position:center;border-radius:8px;margin-bottom:2rem" id="mImg"></div>
					<div class="mb-3">
						<label class="form-label text-uppercase fw-bold small text-secondary">Descripción</label>
						<p id="mDesc"></p>
					</div>
					<div class="row">
						<div class="col-6">
							<label class="form-label text-uppercase fw-bold small text-secondary">Precio</label>
							<p class="h5" id="mPrice"></p>
						</div>
						<div class="col-6">
							<label class="form-label text-uppercase fw-bold small text-secondary">Ubicación</label>
							<p id="mLoc"></p>
						</div>
					</div>
				</div>
				<div class="modal-footer border-top ps-4 pe-4">
					<button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cerrar</button>
					<a id="mWa" class="btn btn-success btn-sm" target="_blank">WhatsApp</a>
				</div>
			</div>
		</div>
	</div>

	<footer class="bg-dark border-top mt-5">
		<div class="container-xxl py-5">
			<div class="row g-4 mb-4">
				<div class="col-md-3"><h6 class="fw-bold">Miriam Vazquez</h6><p class="small text-secondary">Corredor Inmobiliario</p></div>
				<div class="col-md-3"><h6 class="fw-bold">Contacto</h6><p class="small text-secondary">📱 +502 7777 7777</p></div>
				<div class="col-md-3"><h6 class="fw-bold">Ubicación</h6><p class="small text-secondary">Zona 10, Guatemala</p></div>
				<div class="col-md-3"><h6 class="fw-bold">Social</h6><p class="small text-secondary"><a href="#" class="text-white text-decoration-none">Facebook</a> | <a href="#" class="text-white text-decoration-none">Instagram</a></p></div>
			</div>
			<p class="text-center text-secondary small mb-0">&copy; 2026 Miriam Vazquez Real Estate</p>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="script.js"></script>
</body>
</html>
